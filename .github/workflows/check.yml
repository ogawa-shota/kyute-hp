name: check

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Column check
        run: npm run column:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - name: Audit rendered production build
        env:
          SEO_BASE_URL: http://localhost:3000
          SEO_EXPECTED_ORIGIN: https://www.kyute.jp
        run: |
          npm start > /tmp/kyute-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run seo:audit -- --strict --output seo-audit/local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-seo-audit
          path: seo-audit/
          if-no-files-found: ignore
          retention-days: 14
